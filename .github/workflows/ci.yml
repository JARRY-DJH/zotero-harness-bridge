name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20", "22", "24"]
        include:
          # One extra run so the ">=18" claim in package.json stays honest.
          - os: ubuntu-latest
            node: "18"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show the toolchain
        run: node --version

      - name: Syntax-check every module
        shell: bash
        run: |
          set -euo pipefail
          for file in src/server.mjs src/config.mjs scripts/setup.mjs test/mock-zotero.mjs test/server.test.mjs; do
            node --check "$file"
          done

      - name: Run the test suite
        run: npm test

      - name: Smoke-test the CLI without Zotero
        shell: bash
        run: |
          set -euo pipefail
          node src/server.mjs --version
          node src/server.mjs --help > /dev/null
          node src/server.mjs --print-config
          node scripts/setup.mjs --help > /dev/null
          node scripts/setup.mjs --dsh | grep -q "mcp-zotero"

      - name: Without Zotero, --check must fail with exit code 1
        shell: bash
        run: |
          set +e
          node src/server.mjs --check
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected exit code 1 while Zotero is closed, got $status"
            exit 1
          fi

      - name: Report what npm would publish
        run: npm pack --dry-run
