# ---------------------------------------------------------------------------
# DeepSeek Harness (DSH) patch entry: expose your Zotero library to the model.
#
# Append this block to the patch layer of the DSH profile you use:
#     Windows     %USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml
#     macOS/Linux ~/.dsh/profiles/<profile>/cordis.patch.yml
#
# Two placeholders must be replaced first:
#   <NODE_EXECUTABLE>  absolute path to the node binary
#                      (run: node -e "console.log(process.execPath)")
#   <SERVER_ENTRY>     absolute path to this repository's src/server.mjs
#
# Do not edit this file by hand if you can avoid it: run
#
#     node scripts/setup.mjs --dsh
#
# which prints the same block with this machine's real paths already filled in.
#
# Zotero must be running with:
#   Edit > Settings > Advanced >
#   "Allow other applications on this computer to communicate with Zotero"
#
# Tools surface to the model as mcp__zotero__<tool>.
# ---------------------------------------------------------------------------
- insert:
    - id: mcp-zotero
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: zotero
        transport: stdio
        command: '<NODE_EXECUTABLE>'
        args:
          - '<SERVER_ENTRY>'
        env:
          # Local Zotero API (default). For the Zotero Web API use
          # https://api.zotero.org/users/<userID> and set ZOTERO_API_KEY.
          # DSH sanitises the child environment, so every variable the server
          # needs has to be listed here.
          ZOTERO_API_BASE: 'http://127.0.0.1:23119/api/users/0'
        toolCallTimeoutMs: 90000
        # Let the harness boot even when Zotero is closed: the server itself
        # always starts, only individual tool calls fail.
        failOnStartupError: false
